# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

$activeBorderColor = rgb(727272)
$activeTabColor = rgb(d24646)


general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2

    col.active_border = $activeBorderColor
}

decoration {
    # Use round window corners
    rounding = 6

    shadow {
        enabled = true
        range = 32
        render_power = 2
        color = rgba(00000050)
    }
}


group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor

    groupbar {
        enabled = true
        scrolling = true
        render_titles = false
        font_size = 0
        height = 0

        rounding = 3
        round_only_edges = false
        rounding_power = 2

        gradients = false

        gaps_in = 6
        gaps_out = 6
        keep_upper_gap = false

        indicator_height = 5
        indicator_gap = 0
        stacked = false

        col.inactive = $inactiveBorderColor

        col.active = $activeTabColor
    }
}

animations {
    enabled = true

    animation = workspaces, 1, 3.5, easeOutQuint
    animation = specialWorkspace, 1, 3.5, easeOutQuint, slidevert
}
